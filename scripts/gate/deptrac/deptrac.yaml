# Schichtregeln aus ADR 0030 (läuft im Gate-Container, Pfade dort).
# Die Zuordnung der Wurzel-Klassen steht hier als Liste; die Klassen bleiben in ihrem Namespace.
# Eine Wurzel-Klasse ohne Eintrag ist unzugeordnet und macht das Gate rot (gate.js, deptrac.js).
# Die Baseline darf nur schrumpfen (ADR 0030, Nachtrag); jeder Eintrag nennt das Folgeticket.
imports:
  - deptrac-baseline.yaml
deptrac:
  paths:
    - /var/www/html/public/local/coursepilot/classes
  analyser:
    types:
      - class
      - class_superglobal
      - use
      - function
      - function_superglobal
  layers:
    - name: Einstieg
      collectors:
        - type: classNameRegex
          value: '#^local_coursepilot\\(dispatcher|tool_registry|observer|external_schema_converter|privacy_surface)$#'
        - type: classNameRegex
          value: '#^local_coursepilot\\(output|task|check|admin|privacy)\\#'
    # Jedes Werkzeug ist eine eigene Schicht, damit Werkzeug -> Werkzeug ein Verstoß ist
    # (deptrac erlaubt Abhängigkeiten innerhalb einer Schicht immer).
    - name: Werkzeug_add_glossary_entries
      collectors:
        - type: classNameRegex
          value: '#^local_coursepilot\\external\\add_glossary_entries$#'
    - name: Werkzeug_add_questions_to_quiz
