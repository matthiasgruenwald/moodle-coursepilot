# Baseline der bekannten Schichtverstoesse (ADR 0030, Nachtrag 09.10.2026).
# Darf nur schrumpfen: kein Eintrag ohne Ticket, neue Verstöße blockieren, und ein Eintrag,
# den der Code nicht mehr braucht, ist selbst rot (Gate: deptrac-baseline-stale).
# Jeder Eintrag nennt das Folgeticket, das ihn auflöst; Ziel ist eine leere Baseline.
deptrac:
  skip_violations:
    # Wiederherstellen ruft zwei Werkzeuge -> #700
    local_coursepilot\external\restore_activity_version:
      - local_coursepilot\external\set_completion
      - local_coursepilot\external\update_module_settings
