# Matrix-Instanz des Gates (`gate matrix`): abweichende Moodle-Version und Datenbank, privat und nur
# bei Bedarf gestartet. Start und Einrichtung: scripts/gate/matrix-instance.sh. Der Projektname
# beginnt mit kurspilot-gate-, damit host-load.js die Container als eigene zaehlt.
name: kurspilot-gate-matrix
services:
  webserver:
    image: moodlehq/moodle-php-apache:${GATE_PHP}
    volumes:
      - "${GATE_DIR}/moodle:/var/www/html"
      - "${GATE_DIR}/moodledata:/var/www/moodledata"
      - "${GATE_DIR}/phpunitdata:/var/www/phpunitdata"
      - "${GATE_DIR}/plugin:/var/www/html/public/local/coursepilot"
    environment:
      MOODLE_DOCKER_DBTYPE: ${GATE_DBTYPE}
      MOODLE_DOCKER_DBNAME: moodle_gate
      MOODLE_DOCKER_DBUSER: moodle
      MOODLE_DOCKER_DBPASS: "${GATE_DB_PASSWORD}"
      MOODLE_DOCKER_DBCOLLATION: utf8mb4_bin
  db-mariadb:
    profiles: [mariadb]
    image: mariadb:11.4
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
      --innodb_file_per_table=On --wait-timeout=28800 --skip-log-bin
      --innodb_flush_log_at_trx_commit=0 --innodb_doublewrite=0
    volumes: ["${GATE_DIR}/db:/var/lib/mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: "${GATE_DB_PASSWORD}"
      MYSQL_USER: moodle
      MYSQL_PASSWORD: "${GATE_DB_PASSWORD}"
      MYSQL_DATABASE: moodle_gate
    networks: {default: {aliases: [db]}}
  db-pgsql:
    profiles: [pgsql]
    image: postgres:17
    command: -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    volumes: ["${GATE_DIR}/db:/var/lib/postgresql/data"]
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: "${GATE_DB_PASSWORD}"
      POSTGRES_DB: moodle_gate
    networks: {default: {aliases: [db]}}
