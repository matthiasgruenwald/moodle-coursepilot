# Native Server-MCP CI (Issue #268, Spec 0025 / Release-Reife #567).
#
# Prueft ausschliesslich den nativen Server-MCP (Plugin/src/local_coursepilot)
# reproduzierbar auf frischen GitHub-Actions-Runnern - kein Zugriff auf die
# Spike- oder Produktivinstanz, keine persoenlichen Verbindungen, kein
# Praxiskurs (User Story 2/14).
#
# quality: Moodle 5.1, derselbe full-Einstieg wie lokal, inklusive Ratsche.
# phpunit: weitere unterstützte Moodle-/DB-Kombinationen ohne zweite Coverage-Regel.
# js-native und artifact bleiben Pflichtjobs; Gate (required) prüft alle Ergebnisse.
# Fehlgeschlagene, fehlende oder übersprungene Jobs können nicht grün aggregieren.
#
# Bewusst KEIN paths-Filter: Aenderungen an Test-, Build- und
# Workflow-Konfiguration selbst loesen den Pflichtlauf aus, kein
# unbeabsichtigtes Ausblenden ueber Pfadmuster.
#
# Supportmatrix (dokumentiert, siehe auch docs/ci-native-server-mcp.md):
#   Moodle 5.1 (MOODLE_501_STABLE) - Pflicht, Mindestversion ab 2.1 (ADR 0027).
#   Moodle 5.2 / 5.3 - Pflicht auf MariaDB 11 und PostgreSQL 17 (#679).
#   PHP 8.3 und 8.4; frische ZIP-Installation auf jeder Moodle-Linie.

name: Native Server-MCP CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request: {}
  workflow_dispatch:
    inputs:
      target_branch:
        description: Zielbranch für die Ratsche beim manuellen Abnahmelauf
        type: choice
        options: [dev, main]
        default: dev
        required: true

# Nur der neueste Lauf je Ref zaehlt - keine veralteten, parallel laufenden
# Ergebnisse fuer denselben Branch/PR.
concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full quality gate (Moodle 5.1, MariaDB, PHP 8.4)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GATE_DIR: ${{ runner.temp }}/coursepilot-gate
      GATE_MOODLE_REPO: ${{ runner.temp }}/moodle-source
      GATE_MOODLE_REF: origin/MOODLE_501_STABLE
      # PR: actual target branch. Push: compare the state before the push.
      GATE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'push' && github.event.before || format('origin/{0}', inputs.target_branch) }}
    steps:
      - name: Vollständige Plugin-Historie und Zielbranch-Refs auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vergleich und Git-Historie protokollieren
        run: |
          set -o pipefail
          mkdir -p "$GATE_DIR/reports"
          {
            git rev-parse HEAD
            echo "GATE_BASE_REF=$GATE_BASE_REF"
            git rev-parse --verify "$GATE_BASE_REF^{commit}"
            git rev-parse --is-shallow-repository
            git merge-base HEAD "$GATE_BASE_REF"
          } | tee "$GATE_DIR/reports/git-context.log"

      - name: Isoliertes Moodle-5.1-Gate mit versionierten Werkzeugen einrichten
        run: |
          set -o pipefail
          git clone --branch MOODLE_501_STABLE https://github.com/moodle/moodle.git "$GATE_MOODLE_REPO"
          bash scripts/gate/setup-container.sh 2>&1 | tee "$GATE_DIR/reports/setup.log"

      - name: Verbindliches volles Gate
        run: |
          set +e
          npm run gate -- full 2>&1 | tee "$GATE_DIR/reports/full.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$GATE_DIR/reports/full.exit"
          exit "$result"

      - name: Trend und Diagnose hochladen (auch bei rotem Gate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-trend-MOODLE_501_STABLE-${{ github.sha }}
          path: ${{ env.GATE_DIR }}/reports/
          if-no-files-found: error
          retention-days: 30

  phpunit:
    name: PHPUnit (${{ matrix.moodle-branch }}, ${{ matrix.database }}, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_502_STABLE
            database: mariadb
            php-version: '8.3'
          - moodle-branch: MOODLE_502_STABLE
            database: pgsql
            php-version: '8.4'
          - moodle-branch: MOODLE_503_STABLE
            database: mariadb
            php-version: '8.3'
          - moodle-branch: MOODLE_503_STABLE
            database: pgsql
            php-version: '8.4'
    env:
      PHP_VERSION: ${{ matrix.php-version }}
      DB: ${{ matrix.database }}
      DB_USER: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
      DB_PASS: ${{ matrix.database == 'pgsql' && 'postgres' || '' }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Native Plugin-Quelle auschecken
        uses: actions/checkout@v4
        with:
          path: plugin
          sparse-checkout: |
            Plugin/src/local_coursepilot
            scripts/ci

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pgsql, mysqli, gd, zip, soap, intl, exif, mbstring, xml
          coverage: none
          # Uploadgrenzen wie auf realen Kurspilot-Servern (Spike: 200M/206M);
          # import_questions_xml_test setzt voraus, dass die Servergrenze
          # ueber der Fachgrenze MAX_XML_BYTES liegt (PHP-Default 2M nicht).
          ini-values: max_input_vars=5000, upload_max_filesize=200M, post_max_size=206M
          tools: composer:v2

      - name: moodle-plugin-ci installieren
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Native Plugin unter dem erwarteten Namen bereitstellen
        run: |
          mkdir -p ci-plugin
          cp -R plugin/Plugin/src/local_coursepilot ci-plugin/local_coursepilot

      - name: Moodle + Testdatenbank + Testdateibereich einrichten (frisch, kein Spike-Zugriff)
        env:
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
        run: moodle-plugin-ci install --plugin ci-plugin/local_coursepilot --db-host=127.0.0.1

      - name: PHP-Syntaxpruefung (guenstiges Sicherheitsnetz vor dem vollen Testlauf)
        run: moodle-plugin-ci phplint

      - name: Volle native PHPUnit-Suite (Coverage misst ausschließlich quality)
        run: moodle-plugin-ci phpunit

  js-native:
    name: Native JS/AMD
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: AMD-Quellmodul syntaktisch pruefen
        run: node --check Plugin/src/local_coursepilot/amd/src/location_selection.js

      - name: Native JS-Suite (dokumentierter Ausschluss plattform-/altstandgebundener Faelle)
        run: node scripts/ci/run-js-tests.js

  artifact:
    name: Release-Artefakt (${{ matrix.moodle-branch }}, frische Installation)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        moodle-branch: [MOODLE_501_STABLE, MOODLE_502_STABLE, MOODLE_503_STABLE]
    env:
      PHP_VERSION: '8.4'
      DB: mariadb
      MOODLE_BRANCH: ${{ matrix.moodle-branch }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pgsql, mysqli, gd, zip, soap, intl, exif, mbstring, xml
          coverage: none
          ini-values: max_input_vars=5000
          tools: composer:v2

      - name: Release-ZIP bauen (#577)
        run: npm run build:native-release

      - name: ZIP-Pruefsumme protokollieren (Abnahmenachweis #578)
        # upload-artifact verpackt das ZIP erneut - nur diese Zeile nennt die
        # Pruefsumme des Plugin-ZIPs selbst.
        run: sha256sum dist/native-release/local_coursepilot-*.zip

      - name: ZIP entpacken - dasselbe Artefakt, das eine Administration installieren wuerde
        run: |
          mkdir -p artifact-plugin
          unzip -q dist/native-release/local_coursepilot-*.zip -d artifact-plugin

      - name: moodle-plugin-ci installieren
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Frische Moodle-Instanz mit dem entpackten ZIP installieren (getrennt vom phpunit-Job)
        run: moodle-plugin-ci install --plugin artifact-plugin/local_coursepilot --db-host=127.0.0.1

      - name: PHP-Syntaxpruefung des installierten Artefakts
        run: moodle-plugin-ci phplint

      - name: Moodle-Site installieren (moodle-plugin-ci richtet nur die PHPUnit-Datenbank ein)
        # Zufaelliges Admin-Passwort je Lauf, nirgends ausgegeben.
        run: |
          php moodle/admin/cli/install_database.php --agree-license \
            --adminpass="CI#$(openssl rand -hex 16)" --adminemail=admin@example.com \
            --fullname="Coursepilot CI" --shortname="CI"

      - name: Registrierung, Discovery und autorisierten Werkzeugaufruf pruefen
        # moodle-plugin-ci klont Moodle standardmaessig nach ./moodle
        # (relativ zum Aufrufverzeichnis, hier $GITHUB_WORKSPACE).
        run: |
          cp scripts/ci/verify-native-artifact.php moodle/admin/cli/verify-native-artifact.php
          php moodle/admin/cli/verify-native-artifact.php

      - name: Artefakt hochladen (auch bei Fehlschlag)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-release-zip-${{ matrix.moodle-branch }}-${{ github.sha }}
          path: dist/native-release/local_coursepilot-*.zip
          if-no-files-found: warn
          retention-days: 30

  gate:
    name: Gate (required)
    if: always()
    needs: [quality, phpunit, js-native, artifact]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Alle Pflichtjobs erfolgreich?
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/required-check.js
